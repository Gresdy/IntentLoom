# GitHub secret scanning configuration for Gresdy/IntentLoom.
#
# The cc_switch module's `subscription.rs` ships with the public Google
# Gemini CLI OAuth client_id / client_secret (sourced verbatim from
# google-gemini/gemini-cli). These are not private secrets — they're the
# OAuth client Google publishes for the open-source CLI — but GitHub's
# partner-pattern scanner still flags them.
#
# Excluding the file from alerts keeps the dashboard clean. Push-protection
# is governed by the repository's "Allowed alert dismissers" settings; if
# you want to dismiss a push-protection block, follow the unblock URL the
# CLI surfaces during `git push`.
paths-ignore:
  - src-tauri/src/cc_switch/services/subscription.rs
