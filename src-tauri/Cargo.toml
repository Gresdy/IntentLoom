[package]
name = "intentloom"
version = "0.1.0"
description = "Intent-driven AI coding assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "intentloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
tokio = { version = "1", features = ["process", "fs", "macros", "time", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log = "0.4"
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
thiserror = "2.0"
anyhow = "1.0"
toml = "0.8"
toml_edit = "0.22"
flate2 = "1"
brotli = "7"
zstd = "0.13"
arboard = "3.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2.5"
reqwest = { version = "=0.12.10", features = ["json", "blocking", "rustls-tls", "stream", "socks", "multipart"] }
urlencoding = "2"
zip = "2"
walkdir = "2"
libc = "0.2"
ureq = "2"
opener = "0.7"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"  # unify version
axum = "0.7"
tempfile = "3"
# skills-manager migrated dependencies
git2 = { version = "0.19", features = ["vendored-openssl"] }
fs2 = "0.4"
notify = "6.1"
aes-gcm = "0.10"
unicode-normalization = "0.1"
caseless = "0.2"
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
# Knowledge base / local RAG (v1)
pdf-extract = "0.12"
scraper = "0.18"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }

[dev-dependencies]

serial_test = "3"

[features]
# 让 cc-switch 自己的 `#[cfg_attr(not(feature = "test-hooks"), doc(hidden))]` 通过,
# 避免 6 个 `unexpected cfg condition value: test-hooks` 警告。
# IntentLoom 不用 test-hooks, 这是占位 feature, 保持 cc-switch 上游代码不需改。
test-hooks = []
